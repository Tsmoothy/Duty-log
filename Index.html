<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#12140F" />
<title>Duty Log</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background: #12140F; margin: 0; padding: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // Storage shim: mimics the window.storage.get/set/delete/list API using localStorage,
  // so the app persists data on this device without needing the Claude artifact runtime.
  window.storage = {
    async get(key, shared) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return null;
        return { key, value: raw, shared: !!shared };
      } catch (e) { return null; }
    },
    async set(key, value, shared) {
      try {
        localStorage.setItem(key, value);
        return { key, value, shared: !!shared };
      } catch (e) { return null; }
    },
    async delete(key, shared) {
      try {
        localStorage.removeItem(key);
        return { key, deleted: true, shared: !!shared };
      } catch (e) { return null; }
    },
    async list(prefix, shared) {
      try {
        const p = prefix || "";
        const keys = Object.keys(localStorage).filter((k) => k.startsWith(p));
        return { keys, prefix: p, shared: !!shared };
      } catch (e) { return null; }
    },
  };
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo } = React;

const STORAGE_KEY = "duty-log-entries-v2";
const REWARDS_KEY = "duty-log-rewards-v1";
const RATE = 5; // points per hour, per set, or per flat completion
const DAILY_MIN = 50; // SP needed to hit the daily minimum
const MIN_BONUS = 10; // bonus SP for hitting the daily minimum

const DEFAULT_REWARDS = [
  { id: "r1", name: "Gaming session", cost: 40 },
  { id: "r2", name: "Takeout meal", cost: 60 },
  { id: "r3", name: "Guilt-free rest day", cost: 100 },
  { id: "r4", name: "New gear / tool", cost: 150 },
];

const CATEGORIES = {
  cyber: { label: "CYBER / DEGREE", accent: "#D9A544", accentDim: "#6b5527" },
  net: { label: "NETWORKING", accent: "#4FA8A0", accentDim: "#295552" },
  fit: { label: "FITNESS", accent: "#C1553A", accentDim: "#5c291d" },
};

// type: "hours" (step 0.5, 5 pts/hr) | "sets" (step 1, 5 pts/set)
const ACTIVITIES = [
  { id: "school-work", cat: "cyber", label: "School assignment work", type: "hours", step: 0.5 },
  { id: "secplus", cat: "cyber", label: "Security+ study block", type: "hours", step: 0.5 },
  { id: "net-study", cat: "net", label: "Networking study block", type: "hours", step: 0.5 },
  { id: "home-lab", cat: "net", label: "Home lab / Linux practice", type: "hours", step: 0.5 },
  { id: "workout", cat: "fit", label: "Workout", type: "sets", step: 1 },
  { id: "cardio", cat: "fit", label: "Cardio / movement", type: "hours", step: 0.5 },
];

// Uncategorized daily habits. "flat" = one-time +5 toggle. "count" = repeatable, +2.5 per tap.
const BASICS = [
  { id: "make-bed", label: "Make bed", type: "flat" },
  { id: "cook", label: "Cook / meal prep", type: "flat" },
  { id: "shower", label: "Shower", type: "count", step: 0.5 },
  { id: "brush-teeth", label: "Brush teeth", type: "count", step: 0.5 },
];

const ALL_ITEMS = [...ACTIVITIES, ...BASICS];

const RANKS = [
  "Recruit", "Cadet", "Field Tech", "Line Operator", "Systems Operator",
  "Senior Operator", "Specialist", "Senior Specialist", "Chief Operator", "Command Chief",
];

const UNIT_WORD = { hours: "hr", sets: "set", count: "x" };

function todayStr(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return todayStr(d);
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function formatDateNumeric(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
}

function pointsFor(act, qty) {
  if (!qty) return 0;
  return Math.round(qty * RATE * 10) / 10;
}

function dayBasePoints(dayEntry) {
  if (!dayEntry) return 0;
  let sum = 0;
  for (const [id, qty] of Object.entries(dayEntry)) {
    const act = ALL_ITEMS.find((a) => a.id === id);
    if (act) sum += pointsFor(act, qty);
  }
  return Math.round(sum * 10) / 10;
}

function hitDailyMin(dayEntry) {
  return dayBasePoints(dayEntry) >= DAILY_MIN;
}

function dayTotalWithBonus(dayEntry) {
  const base = dayBasePoints(dayEntry);
  return hitDailyMin(dayEntry) ? Math.round((base + MIN_BONUS) * 10) / 10 : base;
}

function DutyLog() {
  const [entries, setEntries] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [saveError, setSaveError] = useState(false);

  const [catalog, setCatalog] = useState(DEFAULT_REWARDS);
  const [redemptions, setRedemptions] = useState([]);
  const [rewardsLoaded, setRewardsLoaded] = useState(false);
  const [newRewardName, setNewRewardName] = useState("");
  const [newRewardCost, setNewRewardCost] = useState("");

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) setEntries(JSON.parse(res.value));
      } catch (e) {
        // no existing data yet
      } finally {
        setLoaded(true);
      }
    })();
    (async () => {
      try {
        const res = await window.storage.get(REWARDS_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setCatalog(parsed.catalog || DEFAULT_REWARDS);
          setRedemptions(parsed.redemptions || []);
        }
      } catch (e) {
        // no existing rewards data yet
      } finally {
        setRewardsLoaded(true);
      }
    })();
  }, []);

  const persist = useCallback(async (next) => {
    try {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
      setSaveError(!result);
    } catch (e) {
      setSaveError(true);
    }
  }, []);

  const persistRewards = useCallback(async (nextCatalog, nextRedemptions) => {
    try {
      const result = await window.storage.set(
        REWARDS_KEY,
        JSON.stringify({ catalog: nextCatalog, redemptions: nextRedemptions }),
        false
      );
      setSaveError(!result);
    } catch (e) {
      setSaveError(true);
    }
  }, []);

  const adjustActivity = (activityId, delta, type) => {
    setEntries((prev) => {
      const dayEntry = { ...(prev[selectedDate] || {}) };
      const current = dayEntry[activityId] || 0;
      let next;
      if (type === "flat") {
        next = current > 0 ? 0 : 1;
      } else {
        next = Math.max(0, Math.round((current + delta) * 10) / 10);
      }
      if (next === 0) delete dayEntry[activityId];
      else dayEntry[activityId] = next;

      const nextAll = { ...prev, [selectedDate]: dayEntry };
      if (Object.keys(dayEntry).length === 0) delete nextAll[selectedDate];
      persist(nextAll);
      return nextAll;
    });
  };

  const redeemReward = (reward) => {
    const entry = { id: `${Date.now()}`, rewardId: reward.id, name: reward.name, cost: reward.cost, date: todayStr() };
    setRedemptions((prev) => {
      const next = [entry, ...prev];
      persistRewards(catalog, next);
      return next;
    });
  };

  const undoRedemption = (redemptionId) => {
    setRedemptions((prev) => {
      const next = prev.filter((r) => r.id !== redemptionId);
      persistRewards(catalog, next);
      return next;
    });
  };

  const addReward = () => {
    const cost = parseInt(newRewardCost, 10);
    if (!newRewardName.trim() || !cost || cost <= 0) return;
    const entry = { id: `${Date.now()}`, name: newRewardName.trim(), cost };
    setCatalog((prev) => {
      const next = [...prev, entry];
      persistRewards(next, redemptions);
      return next;
    });
    setNewRewardName("");
    setNewRewardCost("");
  };

  const deleteReward = (rewardId) => {
    setCatalog((prev) => {
      const next = prev.filter((r) => r.id !== rewardId);
      persistRewards(next, redemptions);
      return next;
    });
  };

  const totalPoints = useMemo(() => {
    let sum = 0;
    for (const dayEntry of Object.values(entries)) sum += dayTotalWithBonus(dayEntry);
    return Math.round(sum * 10) / 10;
  }, [entries]);

  const creditsSpent = useMemo(
    () => redemptions.reduce((sum, r) => sum + r.cost, 0),
    [redemptions]
  );
  const creditsAvailable = Math.round((totalPoints - creditsSpent) * 10) / 10;

  const categoryPoints = useMemo(() => {
    const totals = { cyber: 0, net: 0, fit: 0 };
    for (const dayEntry of Object.values(entries)) {
      for (const [id, qty] of Object.entries(dayEntry)) {
        const act = ACTIVITIES.find((a) => a.id === id);
        if (act) totals[act.cat] += pointsFor(act, qty);
      }
    }
    for (const k of Object.keys(totals)) totals[k] = Math.round(totals[k] * 10) / 10;
    return totals;
  }, [entries]);

  const streak = useMemo(() => {
    let count = 0;
    let cursor = todayStr();
    if (!hitDailyMin(entries[cursor])) {
      cursor = addDays(cursor, -1);
    }
    while (hitDailyMin(entries[cursor])) {
      count += 1;
      cursor = addDays(cursor, -1);
    }
    return count;
  }, [entries]);

  const level = Math.floor(totalPoints / 100);
  const rank = RANKS[Math.min(level, RANKS.length - 1)];
  const ptsIntoLevel = Math.round(totalPoints % 100);

  const selectedDayEntry = entries[selectedDate] || {};
  const selectedDayBase = dayBasePoints(selectedDayEntry);
  const selectedDayPts = dayTotalWithBonus(selectedDayEntry);
  const selectedDayHitMin = hitDailyMin(selectedDayEntry);

  const last14 = useMemo(() => {
    const days = [];
    for (let i = 13; i >= 0; i--) days.push(addDays(todayStr(), -i));
    return days;
  }, []);

  const isToday = selectedDate === todayStr();

  if (!loaded || !rewardsLoaded) {
    return (
      <div style={{ background: "#12140F", minHeight: "100vh" }} className="flex items-center justify-center">
        <div className="font-mono text-sm tracking-widest" style={{ color: "#8FCB6B" }}>LOADING LOG...</div>
      </div>
    );
  }

  return (
    <div style={{ background: "#12140F", color: "#8FCB6B" }} className="min-h-screen w-full font-sans pb-10">
      <div className="max-w-md mx-auto px-4 pt-6">
        {/* Header / Status board */}
        <div className="mb-5">
          <div className="text-[10px] tracking-[0.25em] font-mono mb-1" style={{ color: "#8FCB6B" }}>DUTY LOG · 6-MONTH OPS</div>
          <div className="flex items-end justify-between">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <button
                  onClick={() => setSelectedDate((d) => addDays(d, -1))}
                  className="font-mono text-sm leading-none"
                  style={{ color: "#8FCB6B" }}
                >
                  ‹
                </button>
                <span className="text-sm font-mono font-semibold" style={{ color: "#8FCB6B" }}>
                  {formatDateNumeric(selectedDate)}
                </span>
                <button
                  onClick={() => setSelectedDate((d) => (isToday ? d : addDays(d, 1)))}
                  disabled={isToday}
                  className="font-mono text-sm leading-none disabled:opacity-30"
                  style={{ color: "#8FCB6B" }}
                >
                  ›
                </button>
              </div>
              <div className="text-2xl font-bold tracking-tight uppercase" style={{ color: "#D9A544" }}>
                {rank}
              </div>
              <div className="text-[11px] font-mono mt-0.5" style={{ color: "#8FCB6B" }}>
                LVL {level} · {ptsIntoLevel}/100 to next
              </div>
            </div>
            <div className="text-right">
              <div className="text-3xl font-bold font-mono leading-none" style={{ color: "#8FCB6B" }}>
                {totalPoints}
              </div>
              <div className="text-[10px] tracking-widest font-mono mt-1" style={{ color: "#8FCB6B" }}>TOTAL SP</div>
            </div>
          </div>
          <div className="h-1.5 w-full bg-[#1B1F16] rounded-full mt-3 overflow-hidden">
            <div
              className="h-full rounded-full transition-all duration-300"
              style={{ width: `${ptsIntoLevel}%`, background: "#D9A544" }}
            />
          </div>
          <div className="flex items-center gap-4 mt-3 text-[11px] font-mono" style={{ color: "#8FCB6B" }}>
            <span>
              🔥 <span className="font-bold" style={{ color: "#8FCB6B" }}>{streak}</span> day streak
            </span>
          </div>
        </div>

        {/* Category meters */}
        <div className="grid grid-cols-3 gap-2 mb-6">
          {Object.entries(CATEGORIES).map(([key, cat]) => (
            <div key={key} className="bg-[#1B1F16] rounded-lg px-2 py-2.5 border border-[#262b1f]">
              <div className="text-[9px] tracking-wider font-mono mb-1" style={{ color: cat.accent }}>
                {cat.label}
              </div>
              <div className="text-lg font-bold font-mono" style={{ color: "#8FCB6B" }}>
                {categoryPoints[key]}
              </div>
            </div>
          ))}
        </div>

        {/* Activity list grouped by category */}
        <div className="space-y-4 mb-6">
          {Object.entries(CATEGORIES).map(([catKey, cat]) => (
            <div key={catKey}>
              <div className="text-[10px] tracking-[0.2em] font-mono mb-1.5" style={{ color: cat.accent }}>
                {cat.label}
              </div>
              <div className="space-y-1.5">
                {ACTIVITIES.filter((a) => a.cat === catKey).map((act) => {
                  const qty = selectedDayEntry[act.id] || 0;
                  const pts = pointsFor(act, qty);
                  const active = qty > 0;

                  return (
                    <div
                      key={act.id}
                      className="w-full flex items-center justify-between rounded-lg px-3 py-2 border"
                      style={{
                        background: active ? cat.accentDim : "#1B1F16",
                        borderColor: active ? cat.accent : "#262b1f",
                      }}
                    >
                      <div className="min-w-0 flex-1">
                        <div className="text-sm font-semibold truncate" style={{ color: cat.accent }}>
                          {act.label}
                        </div>
                        <div className="text-[11px] font-mono" style={{ color: "#8FCB6B" }}>
                          {qty} {UNIT_WORD[act.type]}
                          {qty !== 1 ? "s" : ""} · {pts} SP
                        </div>
                      </div>
                      <div className="flex items-center gap-2 flex-shrink-0 ml-2">
                        <button
                          onClick={() => adjustActivity(act.id, -act.step, act.type)}
                          className="w-7 h-7 rounded flex items-center justify-center font-mono text-sm border"
                          style={{ borderColor: "#4a4f42", color: "#8FCB6B" }}
                        >
                          −
                        </button>
                        <button
                          onClick={() => adjustActivity(act.id, act.step, act.type)}
                          className="w-7 h-7 rounded flex items-center justify-center font-mono text-sm border"
                          style={{ borderColor: cat.accent, background: cat.accent, color: "#12140F" }}
                        >
                          +
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>

        {/* Daily Basics — uncategorized, flat +5 each */}
        <div className="mb-6">
          <div className="text-[10px] tracking-[0.2em] font-mono mb-1.5" style={{ color: "#8FCB6B", opacity: 0.85 }}>
            DAILY BASICS
          </div>
          <div className="space-y-1.5">
            {BASICS.map((basic) => {
              const qty = selectedDayEntry[basic.id] || 0;
              const active = qty > 0;

              if (basic.type === "flat") {
                return (
                  <button
                    key={basic.id}
                    onClick={() => adjustActivity(basic.id, 0, "flat")}
                    className="w-full flex items-center justify-between rounded-lg px-3 py-2 border text-left"
                    style={{
                      background: active ? "#2a3020" : "#1B1F16",
                      borderColor: active ? "#8FCB6B" : "#262b1f",
                    }}
                  >
                    <div className="flex items-center gap-2 min-w-0">
                      <div
                        className="w-3.5 h-3.5 rounded flex-shrink-0 flex items-center justify-center border"
                        style={{
                          borderColor: active ? "#8FCB6B" : "#4a4f42",
                          background: active ? "#8FCB6B" : "transparent",
                        }}
                      >
                        {active && <span style={{ color: "#12140F" }} className="text-[9px] font-bold">✓</span>}
                      </div>
                      <span className="text-sm font-medium truncate" style={{ color: "#8FCB6B" }}>
                        {basic.label}
                      </span>
                    </div>
                    <span className="text-[10px] font-mono font-bold flex-shrink-0 ml-1" style={{ color: "#8FCB6B", opacity: 0.7 }}>
                      +5
                    </span>
                  </button>
                );
              }

              const pts = pointsFor(basic, qty);
              return (
                <div
                  key={basic.id}
                  className="w-full flex items-center justify-between rounded-lg px-3 py-2 border"
                  style={{
                    background: active ? "#2a3020" : "#1B1F16",
                    borderColor: active ? "#8FCB6B" : "#262b1f",
                  }}
                >
                  <div className="min-w-0 flex-1">
                    <div className="text-sm font-medium truncate" style={{ color: "#8FCB6B" }}>
                      {basic.label}
                    </div>
                    <div className="text-[11px] font-mono" style={{ color: "#8FCB6B", opacity: 0.7 }}>
                      {pts} SP
                    </div>
                  </div>
                  <div className="flex items-center gap-2 flex-shrink-0 ml-2">
                    <button
                      onClick={() => adjustActivity(basic.id, -basic.step, basic.type)}
                      className="w-7 h-7 rounded flex items-center justify-center font-mono text-sm border"
                      style={{ borderColor: "#4a4f42", color: "#8FCB6B" }}
                    >
                      −
                    </button>
                    <button
                      onClick={() => adjustActivity(basic.id, basic.step, basic.type)}
                      className="w-7 h-7 rounded flex items-center justify-center font-mono text-sm border"
                      style={{ borderColor: "#8FCB6B", background: "#8FCB6B", color: "#12140F" }}
                    >
                      +
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="text-center mb-6">
          <div className="text-[11px] font-mono" style={{ color: "#8FCB6B" }}>
            {formatDateLabel(selectedDate)}: <span className="font-bold" style={{ color: "#8FCB6B" }}>{selectedDayPts} SP</span> logged
          </div>
          {selectedDayHitMin ? (
            <div className="text-[11px] font-mono font-bold mt-1" style={{ color: "#D9A544" }}>
              ✓ DAILY MIN HIT · +{MIN_BONUS} BONUS
            </div>
          ) : (
            <div className="text-[11px] font-mono mt-1" style={{ color: "#8FCB6B", opacity: 0.7 }}>
              {selectedDayBase}/{DAILY_MIN} SP toward daily min
            </div>
          )}
        </div>

        {/* Rewards */}
        <div className="mb-6">
          <div className="flex items-baseline justify-between mb-2">
            <div className="text-[10px] tracking-[0.2em] font-mono" style={{ color: "#8FCB6B" }}>
              REWARDS
            </div>
            <div className="text-sm font-mono font-bold" style={{ color: "#8FCB6B" }}>
              {creditsAvailable} credits available
            </div>
          </div>

          <div className="space-y-1.5">
            {catalog.map((reward) => {
              const affordable = creditsAvailable >= reward.cost;
              return (
                <div
                  key={reward.id}
                  className="w-full flex items-center justify-between rounded-lg px-3 py-2 border"
                  style={{ background: "#1B1F16", borderColor: "#262b1f" }}
                >
                  <div className="min-w-0 flex-1">
                    <div className="text-sm font-semibold truncate" style={{ color: "#8FCB6B" }}>
                      {reward.name}
                    </div>
                    <div className="text-[11px] font-mono" style={{ color: "#8FCB6B", opacity: 0.7 }}>
                      {reward.cost} credits
                    </div>
                  </div>
                  <div className="flex items-center gap-2 flex-shrink-0 ml-2">
                    <button
                      onClick={() => deleteReward(reward.id)}
                      className="w-6 h-6 rounded flex items-center justify-center font-mono text-xs"
                      style={{ color: "#8FCB6B", opacity: 0.5 }}
                      title="Remove this reward"
                    >
                      ×
                    </button>
                    <button
                      onClick={() => affordable && redeemReward(reward)}
                      disabled={!affordable}
                      className="rounded px-3 py-1.5 font-mono text-xs font-bold border disabled:opacity-30"
                      style={{
                        borderColor: "#D9A544",
                        background: affordable ? "#D9A544" : "transparent",
                        color: affordable ? "#12140F" : "#D9A544",
                      }}
                    >
                      REDEEM
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Add custom reward */}
          <div className="flex items-center gap-2 mt-2">
            <input
              type="text"
              placeholder="New reward"
              value={newRewardName}
              onChange={(e) => setNewRewardName(e.target.value)}
              className="flex-1 min-w-0 rounded-lg px-3 py-2 text-sm font-mono border bg-transparent"
              style={{ borderColor: "#262b1f", color: "#8FCB6B" }}
            />
            <input
              type="number"
              placeholder="cost"
              value={newRewardCost}
              onChange={(e) => setNewRewardCost(e.target.value)}
              className="w-16 rounded-lg px-2 py-2 text-sm font-mono border bg-transparent"
              style={{ borderColor: "#262b1f", color: "#8FCB6B" }}
            />
            <button
              onClick={addReward}
              className="rounded-lg px-3 py-2 font-mono text-sm font-bold border flex-shrink-0"
              style={{ borderColor: "#8FCB6B", color: "#8FCB6B" }}
            >
              +
            </button>
          </div>

          {/* Recent redemptions */}
          {redemptions.length > 0 && (
            <div className="mt-3">
              <div className="text-[10px] tracking-[0.15em] font-mono mb-1" style={{ color: "#8FCB6B", opacity: 0.6 }}>
                RECENT REDEMPTIONS
              </div>
              <div className="space-y-1">
                {redemptions.slice(0, 4).map((r) => (
                  <div key={r.id} className="flex items-center justify-between text-[11px] font-mono" style={{ color: "#8FCB6B", opacity: 0.7 }}>
                    <span>
                      {r.date} · {r.name} · −{r.cost}
                    </span>
                    <button onClick={() => undoRedemption(r.id)} className="underline flex-shrink-0 ml-2">
                      undo
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* 14-day heat strip */}
        <div className="mb-2">
          <div className="text-[10px] tracking-[0.2em] font-mono mb-2" style={{ color: "#8FCB6B" }}>LAST 14 DAYS</div>
          <div className="flex gap-1">
            {last14.map((d) => {
              const base = dayBasePoints(entries[d]);
              const hit = hitDailyMin(entries[d]);
              const intensity = base === 0 ? "#1B1F16" : hit ? "#8FCB6B" : base < 15 ? "#3a3520" : "#6b5527";
              return (
                <button
                  key={d}
                  onClick={() => setSelectedDate(d)}
                  title={`${d}: ${base} SP${hit ? ` (+${MIN_BONUS} bonus)` : ""}`}
                  className="flex-1 aspect-square rounded"
                  style={{
                    background: intensity,
                    outline: d === selectedDate ? "1.5px solid #8FCB6B" : "none",
                  }}
                />
              );
            })}
          </div>
        </div>

        {saveError && (
          <div className="text-[11px] text-[#C1553A] font-mono text-center mt-4">
            Sync failed — check storage, your taps aren't saved yet.
          </div>
        )}

        <div className="text-center text-[10px] text-[#4a4f42] font-mono mt-8">
          {DAILY_MIN} SP daily min · +{MIN_BONUS} bonus on hit
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DutyLog />);
</script>
</body>
</html>
